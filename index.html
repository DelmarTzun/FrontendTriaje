<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Sistema de Gestión de Triaje Hospitalario</title>

    <!-- Importamos Bootstrap 5 a través de CDN para un diseño rápido y profesional -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">🏥 Hospital General - SGTH</a>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container mt-4">

        <!-- Sistema de Pestañas (Requerimiento de la Interfaz #1) -->
        <ul class="nav nav-tabs mb-4" id="menuTriaje" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-pacientes" data-bs-toggle="tab" data-bs-target="#vista-pacientes" type="button" role="tab">Ver Pacientes</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-registro" data-bs-toggle="tab" data-bs-target="#vista-registro" type="button" role="tab">Nuevo Registro</button>
            </li>
        </ul>

        <!-- Contenido de las Pestañas -->
        <div class="tab-content" id="contenidoTriaje">

            <!-- Pantalla 1: Tablero de Pacientes (GET) -->
            <div class="tab-pane fade show active" id="vista-pacientes" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3>Tablero de Triaje - Delmar Tzun Carnet: 1890-24-4544</h3>
                    <button class="btn btn-outline-primary" onclick="cargarPacientes()">Actualizar Lista</button>
                </div>

                <!-- Contenedor para mostrar mensajes de error si la API falla -->
                <div id="mensajeError" class="alert alert-danger d-none" role="alert">
                    Error al conectar con el servidor. Por favor, intente más tarde.
                </div>

                <!-- Tabla de Pacientes -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover shadow-sm bg-white">
                        <thead class="table-dark">
                            <tr>
                                <th>ID Paciente</th>
                                <th>Nombre</th>       <!-- NUEVO -->
                                <th>Síntomas</th>     <!-- NUEVO -->
                                <th>Gravedad</th>
                                <th>Estado</th>
                                <th>Médico</th>
                                <th>Hora de Ingreso</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPacientesBody">
                            <!-- JavaScript insertará las filas aquí dinámicamente -->
                            <tr><td colspan="5" class="text-center">Cargando pacientes...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pantalla 2: Formulario de Registro (POST) - Lo programaremos en el siguiente paso -->
            <!-- Pantalla 2: Formulario de Registro (POST) -->
            <div class="tab-pane fade" id="vista-registro" role="tabpanel">
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="card shadow-sm p-4">
                            <h4 class="mb-4 text-center text-primary">Ingresar Nuevo Paciente</h4>
                            
                            <!-- Formulario -->
                            <form id="formularioRegistro">
                                <div class="mb-3">
                                    <label for="nombrePaciente" class="form-label">Nombre del Paciente</label>
                                    <input type="text" class="form-control" id="nombrePaciente" required placeholder="Ej. Juan Pérez">
                                </div>
                                <div class="mb-3">
                                    <label for="sintomas" class="form-label">Síntomas</label>
                                    <textarea class="form-control" id="sintomas" rows="2" required placeholder="Describa los síntomas..."></textarea>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="gravedad" class="form-label">Nivel de Gravedad (1 al 5)</label>
                                        <input type="number" class="form-control" id="gravedad" min="1" max="5" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="medicoResponsable" class="form-label">Carnet del Médico</label>
                                        <input type="text" class="form-control" id="medicoResponsable" required placeholder="Ej. MED-1010">
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 mt-3">Registrar Paciente</button>
                            </form>

                            <!-- Contenedor para mostrar alertas de éxito o error -->
                            <div id="mensajePost" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Importamos el script de Bootstrap para el funcionamiento de las pestañas -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Vinculamos nuestro archivo de lógica JavaScript -->
    <script src="script.js"></script>
</body>
</html>
